<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><link rel="stylesheet" href="theme.css"></helmet>
<sc-if value="{{center}}" hint-placeholder-val="{{false}}">
  <div style="display: flex; flex-direction: column; align-items: center; text-align: center; gap: var(--sp-5); color: inherit;">
    <span aria-hidden="true" style="display: block; width: 40px; height: 1px; background: var(--c-accent);"></span>
    <h2 style="margin: 0; font-family: var(--f-display); font-weight: var(--fw-regular); font-size: var(--fs-h2); line-height: var(--lh-tight); letter-spacing: -0.005em; color: inherit; text-wrap: balance;">{{text}}</h2>
  </div>
</sc-if>
<sc-if value="{{left}}" hint-placeholder-val="{{true}}">
  <div style="display: flex; flex-direction: column; align-items: flex-start; gap: var(--sp-5); color: inherit;">
    <span aria-hidden="true" style="display: block; width: 40px; height: 1px; background: var(--c-accent);"></span>
    <h2 style="margin: 0; font-family: var(--f-display); font-weight: var(--fw-regular); font-size: var(--fs-h2); line-height: var(--lh-tight); letter-spacing: -0.005em; color: inherit; text-wrap: balance;">{{text}}</h2>
  </div>
</sc-if>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:600,&quot;height&quot;:200},&quot;text&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Due Diligence&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;align&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;left&quot;,&quot;center&quot;],&quot;default&quot;:&quot;left&quot;,&quot;tsType&quot;:&quot;'left'|'center'&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const c = (this.props.align ?? 'left') === 'center';
    return { text: this.props.text ?? 'Heading', center: c, left: !c };
  }
}
</script>
</body>
</html>
