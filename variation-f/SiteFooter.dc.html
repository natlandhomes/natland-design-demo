<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><link rel="stylesheet" href="theme.css"></helmet>
<footer data-screen-label="Footer">
  <sc-if value="{{showForm}}" hint-placeholder-val="{{true}}">
  <section data-screen-label="Get in touch" style="background: var(--c-bg); border-top: 1px solid var(--c-line);">
    <div style="max-width: var(--max-w); margin: 0 auto; padding: var(--sp-section) var(--gutter); display: grid; grid-template-columns: {{cols}}; gap: {{colGap}}; align-items: start;">
      <div style="display: flex; flex-direction: column; gap: var(--sp-5);">
        <div style="display: flex; flex-direction: column; gap: var(--sp-3);">
          <sc-if value="{{hasNum}}" hint-placeholder-val="{{true}}">
            <div style="display: flex; align-items: flex-end; gap: 12px;">
              <span style="position: relative; display: block; padding-bottom: 6px; font-family: var(--f-display); font-size: 18px; font-weight: var(--fw-semibold); line-height: 1; color: var(--c-ink);">{{num}}<span data-line="" style="position: absolute; left: 0; bottom: 0; display: block; width: 100%; height: 3px; background: var(--c-accent);"></span></span>
              <span data-line="" data-delay="200" style="display: block; width: 28px; height: 2px; margin-bottom: 14px; background: var(--c-accent);"></span>
            </div>
          </sc-if>
          <sc-if value="{{noNum}}" hint-placeholder-val="{{false}}">
            <div style="display: flex; align-items: center; gap: 12px;">
              <span data-line="" style="display: block; width: 24px; height: 2px; background: var(--c-accent);"></span>
              <span style="font-size: 12px; font-weight: var(--fw-semibold); letter-spacing: var(--ls-label); text-transform: uppercase; color: var(--c-ink-soft);">Get in touch</span>
              <span data-line="" data-delay="200" style="display: block; flex: 1; max-width: 140px; height: 1px; background: var(--c-line);"></span>
            </div>
          </sc-if>
          <h2 data-split="" style="margin: 0; font-family: var(--f-display); font-weight: var(--fw-semibold); font-size: clamp(32px, 3vw, 42px); line-height: 1.1; color: var(--c-ink);"><span style="display: inline-block; overflow: hidden; vertical-align: top; padding-bottom: 0.08em;"><span data-w="" style="display: inline-block;">Get</span></span> <span style="display: inline-block; overflow: hidden; vertical-align: top; padding-bottom: 0.08em;"><span data-w="" style="display: inline-block;">in</span></span> <span style="display: inline-block; overflow: hidden; vertical-align: top; padding-bottom: 0.08em;"><span data-w="" style="display: inline-block;">touch</span></span></h2>
        </div>
        <ul style="list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: var(--sp-4);">
          <li data-reveal="" data-delay="100" style="display: grid; grid-template-columns: 28px minmax(0, 1fr); gap: var(--sp-4); align-items: start;">
            <span aria-hidden="true" style="width: 22px; height: 22px; margin-top: 2px; background: var(--c-accent); -webkit-mask: url(https://unpkg.com/lucide-static@0.460.0/icons/map-pin.svg) center / contain no-repeat; mask: url(https://unpkg.com/lucide-static@0.460.0/icons/map-pin.svg) center / contain no-repeat;"></span>
            <span style="font-size: var(--fs-body); line-height: 1.45; color: var(--c-ink);">#130-788 Harbourside Drive,<br>North Vancouver, BC V7P 3R7</span>
          </li>
          <li data-reveal="" data-delay="180" style="display: grid; grid-template-columns: 28px minmax(0, 1fr); gap: var(--sp-4); align-items: center;">
            <span aria-hidden="true" style="width: 20px; height: 20px; background: var(--c-accent); -webkit-mask: url(https://unpkg.com/lucide-static@0.460.0/icons/phone.svg) center / contain no-repeat; mask: url(https://unpkg.com/lucide-static@0.460.0/icons/phone.svg) center / contain no-repeat;"></span>
            <a href="tel:+16049731825" style="font-size: var(--fs-body); color: var(--c-ink); text-decoration: none;" style-hover="color: var(--c-accent);">+1 (604) 973-1825</a>
          </li>
          <li data-reveal="" data-delay="260" style="display: grid; grid-template-columns: 28px minmax(0, 1fr); gap: var(--sp-4); align-items: center;">
            <span aria-hidden="true" style="width: 22px; height: 22px; background: var(--c-accent); -webkit-mask: url(https://unpkg.com/lucide-static@0.460.0/icons/mail.svg) center / contain no-repeat; mask: url(https://unpkg.com/lucide-static@0.460.0/icons/mail.svg) center / contain no-repeat;"></span>
            <a href="mailto:office@natlandhomes.com" style="font-size: var(--fs-body); color: var(--c-ink); text-decoration: none;" style-hover="color: var(--c-accent);">office@natlandhomes.com</a>
          </li>
        </ul>
      </div>
      <form onSubmit="{{submit}}" style="display: flex; flex-direction: column; gap: var(--sp-3);">
        <div data-reveal="" style="display: grid; grid-template-columns: {{pairCols}}; gap: var(--sp-3);">
          <input type="text" name="name" placeholder="Your name *" required="" onChange="{{setName}}" style="height: var(--field-h); padding: 0 var(--sp-4); background: var(--c-bg); border: 1px solid var(--c-line); border-radius: 0; color: var(--c-ink); font-size: var(--fs-small); outline: none; transition: border-color 0.2s;" style-focus="border-color: var(--c-ink);">
          <input type="tel" name="phone" placeholder="Phone number" onChange="{{setPhone}}" style="height: var(--field-h); padding: 0 var(--sp-4); background: var(--c-bg); border: 1px solid var(--c-line); border-radius: 0; color: var(--c-ink); font-size: var(--fs-small); outline: none; transition: border-color 0.2s;" style-focus="border-color: var(--c-ink);">
        </div>
        <input data-reveal="" data-delay="80" type="email" name="email" placeholder="Your e-mail *" required="" onChange="{{setEmail}}" style="height: var(--field-h); padding: 0 var(--sp-4); background: var(--c-bg); border: 1px solid var(--c-line); border-radius: 0; color: var(--c-ink); font-size: var(--fs-small); outline: none; transition: border-color 0.2s;" style-focus="border-color: var(--c-ink);">
        <textarea data-reveal="" data-delay="160" name="message" placeholder="How can we help you ?" rows="3" onChange="{{setMsg}}" style="padding: var(--sp-3) var(--sp-4); background: var(--c-bg); border: 1px solid var(--c-line); border-radius: 0; color: var(--c-ink); font-size: var(--fs-small); line-height: 1.5; resize: vertical; outline: none; transition: border-color 0.2s;" style-focus="border-color: var(--c-ink);"></textarea>
        <div data-reveal="" data-delay="240" style="display: flex; flex-direction: column; gap: var(--sp-2);">
          <button type="submit" data-magnetic="" style="position: relative; overflow: hidden; height: 54px; margin-top: var(--sp-2); background: var(--c-accent); color: var(--c-on-dark); border: 0; border-radius: 0; font-family: var(--f-display); font-size: 18px; font-weight: var(--fw-medium); cursor: pointer; transition: background 0.3s;" style-hover="background: var(--c-dark);">Send</button>
          <p style="margin: 0; text-align: center; font-size: 13px; color: var(--c-muted);">Send opens your email app.</p>
        </div>
      </form>
    </div>
  </section>
  </sc-if>
  <div style="background: var(--c-footer); color: var(--c-on-dark);">
    <div style="max-width: var(--max-w); margin: 0 auto; padding: var(--sp-6) var(--gutter); display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: var(--sp-4);">
      <a href="Home.dc.html" style="display: flex;">
        <img src="assets/logo-white.png" alt="Natland Group" style="height: 44px; width: auto;">
      </a>
      <sc-if value="{{barNav}}" hint-placeholder-val="{{false}}">
        <nav style="display: flex; flex-wrap: wrap; gap: 8px clamp(20px, 3vw, 44px);">
          <a href="Home.dc.html" style="font-size: 14px; color: #fff; text-decoration: none;" style-hover="color: #ff8a98;">Home</a>
          <a href="Portfolio.dc.html" style="font-size: 14px; color: #fff; text-decoration: none;" style-hover="color: #ff8a98;">Portfolio</a>
          <a href="OurServices.dc.html" style="font-size: 14px; color: #fff; text-decoration: none;" style-hover="color: #ff8a98;">Service</a>
          <a href="Contact.dc.html" style="font-size: 14px; color: #fff; text-decoration: none;" style-hover="color: #ff8a98;">Contact Us</a>
        </nav>
      </sc-if>
      <p style="margin: 0; font-size: 14px; color: var(--c-on-dark);">© NATLAND GROUP. All rights reserved.</p>
    </div>
  </div>
  <sc-if value="{{showTop}}" hint-placeholder-val="{{false}}">
    <button type="button" aria-label="Back to top" onClick="{{toTop}}" data-magnetic="" style="position: fixed; right: 24px; bottom: 24px; z-index: 40; width: 52px; height: 52px; display: flex; align-items: center; justify-content: center; background: var(--c-accent); border: 0; border-radius: 50%; cursor: pointer; box-shadow: 0 8px 24px rgba(0, 41, 72, 0.25);" style-hover="background: var(--c-dark);">
      <span aria-hidden="true" style="width: 10px; height: 10px; border-left: 2px solid var(--c-on-dark); border-top: 2px solid var(--c-on-dark); transform: translateY(3px) rotate(45deg);"></span>
    </button>
  </sc-if>
</footer>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:&quot;100%&quot;,&quot;height&quot;:640},&quot;num&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;variant&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;form&quot;,&quot;minimal&quot;],&quot;default&quot;:&quot;form&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;barNav&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;}}">
class Component extends DCLogic {
  mq = window.matchMedia('(max-width: 767px)');
  state = { m: this.mq.matches, y: 0 };
  f = {};
  onMq = () => this.setState({ m: this.mq.matches });
  onScroll = () => { const t = scrollY > 600; if (t !== this.state.top) this.setState({ top: t }); };
  componentDidMount() {
    this.mq.addEventListener('change', this.onMq);
    addEventListener('scroll', this.onScroll, { passive: true });
  }
  componentWillUnmount() {
    this.mq.removeEventListener('change', this.onMq);
    removeEventListener('scroll', this.onScroll);
  }
  renderVals() {
    const m = this.state.m;
    const set = k => e => { this.f[k] = e.target.value; };
    const num = this.props.num ?? '';
    const v = this.props.variant ?? 'form';
    return {
      showForm: v !== 'minimal',
      barNav: v !== 'form' || !!this.props.barNav,
      num, hasNum: !!num, noNum: !num,
      cols: m ? 'minmax(0, 1fr)' : 'minmax(0, 5fr) minmax(0, 7fr)',
      colGap: m ? 'var(--sp-6)' : 'clamp(40px, 6vw, 96px)',
      pairCols: m ? 'minmax(0, 1fr)' : 'minmax(0, 1fr) minmax(0, 1fr)',
      showTop: !m && !!this.state.top,
      toTop: () => window.scrollTo({ top: 0, behavior: 'smooth' }),
      setName: set('name'), setPhone: set('phone'), setEmail: set('email'), setMsg: set('msg'),
      submit: e => {
        e.preventDefault();
        const f = this.f;
        const body = [f.msg, '', f.name, f.phone, f.email].filter(v => v !== undefined).join('\n');
        window.location.href = 'mailto:office@natlandhomes.com?subject=' + encodeURIComponent('Website enquiry' + (f.name ? ' — ' + f.name : '')) + '&body=' + encodeURIComponent(body);
      },
    };
  }
}
</script>
</body>
</html>
