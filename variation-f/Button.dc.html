<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><link rel="stylesheet" href="theme.css"></helmet>
<sc-if value="{{linkPrimary}}" hint-placeholder-val="{{true}}">
  <a href="{{href}}" style="display: inline-flex; align-items: center; justify-content: center; gap: var(--sp-3); height: var(--field-h); padding: 0 var(--sp-7); background: var(--c-accent); color: var(--c-on-dark); border: 1px solid var(--c-accent); font-family: var(--f-body); font-size: var(--fs-label); font-weight: var(--fw-semibold); letter-spacing: var(--ls-label); text-transform: uppercase; text-decoration: none; transition: background 0.25s, border-color 0.25s;" style-hover="background: var(--c-accent-hover); border-color: var(--c-accent-hover); color: var(--c-on-dark);">{{label}}</a>
</sc-if>
<sc-if value="{{buttonPrimary}}" hint-placeholder-val="{{false}}">
  <button type="{{type}}" style="display: flex; align-items: center; justify-content: center; width: 100%; height: var(--field-h); padding: 0 var(--sp-6); background: var(--c-ink); color: var(--c-on-dark); border: 1px solid var(--c-ink); border-radius: 0; font-family: var(--f-body); font-size: var(--fs-label); font-weight: var(--fw-semibold); letter-spacing: var(--ls-label); text-transform: uppercase; cursor: pointer; transition: background 0.25s, border-color 0.25s;" style-hover="background: var(--c-accent); border-color: var(--c-accent);">{{label}}</button>
</sc-if>
<sc-if value="{{buttonLight}}" hint-placeholder-val="{{false}}">
  <button type="{{type}}" style="display: flex; align-items: center; justify-content: center; width: 100%; height: var(--field-h); padding: 0 var(--sp-6); background: var(--c-on-dark); color: var(--c-ink); border: 1px solid var(--c-on-dark); border-radius: 0; font-family: var(--f-body); font-size: var(--fs-label); font-weight: var(--fw-semibold); letter-spacing: var(--ls-label); text-transform: uppercase; cursor: pointer; transition: background 0.25s, color 0.25s, border-color 0.25s;" style-hover="background: var(--c-accent); border-color: var(--c-accent); color: var(--c-on-dark);">{{label}}</button>
</sc-if>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:320,&quot;height&quot;:120},&quot;label&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;BACK&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;href&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Portfolio.dc.html&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;variant&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;primary&quot;,&quot;light&quot;],&quot;default&quot;:&quot;primary&quot;,&quot;tsType&quot;:&quot;'primary'|'light'&quot;},&quot;type&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;submit&quot;,&quot;button&quot;],&quot;default&quot;:&quot;submit&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const v = this.props.variant ?? 'primary';
    const isLink = !!this.props.href;
    return {
      label: this.props.label ?? 'Button',
      href: this.props.href,
      type: this.props.type ?? 'submit',
      linkPrimary: isLink,
      buttonPrimary: !isLink && v !== 'light',
      buttonLight: !isLink && v === 'light',
    };
  }
}
</script>
</body>
</html>
