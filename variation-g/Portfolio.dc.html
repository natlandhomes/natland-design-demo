<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<title>Natland Group — Portfolio</title>
<link rel="stylesheet" href="theme.css">
<style>body{margin:0;background:#001a2f;color:#fff}a{color:#fff}a:hover{color:#ff5a6e}</style>
</helmet>
<dc-import name="SiteFX" intro="{{intro}}" motion="{{motion}}" hint-size="0px,0px"></dc-import>
<dc-import name="SiteHeader" active="portfolio" hint-size="100%,0px"></dc-import>
<main>
  <section data-screen-label="Portfolio / Hero" style="position: relative; overflow: hidden; height: {{heroH}}; min-height: {{heroMin}};">
    <div data-parallax="0.04" style="position: absolute; inset: 0;">
      <sc-if value="{{ready}}" hint-placeholder-val="{{false}}"><sc-for list="{{slides}}" as="s" hint-placeholder-count="0">
        <div style="position: absolute; inset: 0; z-index: {{s.z}}; clip-path: {{s.clip}}; transition: {{s.trans}};">
          <img loading="lazy" src="{{s.hero}}" data-fallback="{{s.fallback}}" alt="{{s.title}}" style="width: 100%; height: 100%; object-fit: cover; object-position: {{s.pos}}; transform: scale({{s.scale}}); transition: {{s.imgTrans}};">
        </div>
      </sc-for></sc-if>
    </div>
    <div aria-hidden="true" style="position: absolute; inset: 0; z-index: 5; background: linear-gradient(to bottom, rgba(0, 26, 47, 0.6) 0%, rgba(0, 26, 47, 0) 22%, rgba(0, 26, 47, 0) 50%, rgba(0, 26, 47, 0.85) 90%, #001a2f 100%);"></div>
    <div data-heroout="" style="position: absolute; left: 0; right: 0; bottom: 0; z-index: 6;">
      <div style="max-width: var(--max-w); margin: 0 auto; padding: 0 var(--gutter) {{heroPadB}}; display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 24px;">
        <div style="display: flex; flex-direction: column; gap: 14px;">
          <span data-reveal="" style="font-size: 13px; font-weight: 600; letter-spacing: 0.26em; text-transform: uppercase;">Our portfolio / {{curNum}}</span>
          <div style="overflow: hidden; padding-bottom: 0.08em;">
            <h1 ref="{{titleRef}}" style="margin: 0; max-width: 900px; font-family: var(--f-display); font-weight: 600; font-size: {{h1Size}}; line-height: 1.04; letter-spacing: -0.015em; text-wrap: balance;">{{curTitle}}</h1>
          </div>
          <div data-reveal="" data-delay="250" style="display: flex; padding-top: 6px;">
            <a href="{{curHref}}" data-magnetic="" style="display: flex; align-items: center; gap: 18px; height: 46px; padding: 0 22px; border: 1.5px solid #fff; color: #fff; text-decoration: none; font-family: var(--f-display); font-size: 13px; font-weight: 600; letter-spacing: 0.22em; transition: background 0.35s, color 0.35s;" style-hover="background: #fff; color: #001a2f;">EXPLORE PROJECT<span aria-hidden="true" style="font-size: 18px; letter-spacing: 0; line-height: 1;">→</span></a>
          </div>
        </div>
        <div data-reveal="" data-delay="350" style="display: flex; align-items: center; gap: 18px;">
          <button type="button" aria-label="Previous project" onClick="{{prev}}" data-magnetic="" style="width: 46px; height: 46px; border-radius: 50%; border: 1.5px solid #fff; background: transparent; color: #fff; font-size: 18px; line-height: 1; cursor: pointer; transition: background 0.3s, color 0.3s;" style-hover="background: #fff; color: #001a2f;">←</button>
          <span style="min-width: 72px; text-align: center; font-family: var(--f-display); font-size: 15px; letter-spacing: 0.12em;">{{curNum}} / {{total}}</span>
          <button type="button" aria-label="Next project" onClick="{{next}}" data-magnetic="" style="width: 46px; height: 46px; border-radius: 50%; border: 1.5px solid #fff; background: transparent; color: #fff; font-size: 18px; line-height: 1; cursor: pointer; transition: background 0.3s, color 0.3s;" style-hover="background: #fff; color: #001a2f;">→</button>
        </div>
      </div>
    </div>
  </section>
  <section data-screen-label="Portfolio / Switcher" style="max-width: var(--max-w); margin: 0 auto; padding: 8px var(--gutter) clamp(32px, 4vw, 56px);">
    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: clamp(12px, 3vw, 28px);">
      <sc-if value="{{ready}}" hint-placeholder-val="{{false}}"><sc-for list="{{strip}}" as="t" hint-placeholder-count="0">
        <button type="button" onClick="{{t.select}}" data-reveal="" data-delay="{{t.delay}}" style="display: flex; flex-direction: column; gap: 10px; padding: 0; background: none; border: 0; color: #fff; text-align: left; cursor: pointer;">
          <span style="position: relative; display: block; width: 100%; aspect-ratio: 16 / 7; overflow: hidden; outline: {{t.outline}}; outline-offset: 0; transition: outline-color 0.3s;">
            <img loading="lazy" src="{{t.image}}" alt="{{t.title}}" style="width: 100%; height: 100%; object-fit: cover; object-position: {{t.pos}}; opacity: {{t.op}}; transition: opacity 0.4s, transform 0.9s cubic-bezier(0.16,1,0.3,1);" style-hover="transform: scale(1.06);">
          </span>
          <span style="font-size: 12px; font-weight: 600; letter-spacing: 0.2em; text-transform: uppercase; color: {{t.color}};">{{t.title}}</span>
        </button>
      </sc-for></sc-if>
    </div>
  </section>
  <section data-screen-label="Portfolio / Projects" style="border-top: 1px solid var(--c-line);">
    <div style="max-width: var(--max-w); margin: 0 auto; padding: clamp(24px, 2.4vw, 32px) var(--gutter) var(--sp-section); display: flex; flex-direction: column; gap: clamp(24px, 2.6vw, 36px);">
      <a href="#" data-zoom="" data-cursor="View" style="display: grid; grid-template-columns: {{featCols}}; gap: {{featGap}}; align-items: center; color: #fff; text-decoration: none;">
        <div data-clip="" style="position: relative; overflow: hidden; aspect-ratio: 2 / 0.95;">
          <img src="assets/seniors.png" alt="SENIORS RESIDENTIAL &amp; COMMERCIAL DEVELOPMENT" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 50% 45%;">
        </div>
        <div style="display: flex; flex-direction: column; gap: 14px;">
          <span data-line="" data-delay="300" style="display: block; width: 32px; height: 2px; background: var(--c-accent);"></span>
          <span data-reveal="" data-delay="350" style="font-family: var(--f-display); font-size: 22px; font-weight: 500; color: var(--c-accent);">01</span>
          <span data-reveal="" data-delay="450" style="font-family: var(--f-display); font-size: {{featTitle}}; font-weight: 500; line-height: 1.25; text-wrap: balance;">Seniors Residential &amp; Commercial Development</span>
          <span data-reveal="" data-delay="550" style="display: flex;"><span data-arrow="" aria-hidden="true" style="width: 26px; height: 26px; background: #fff; -webkit-mask: url(https://unpkg.com/lucide-static@0.460.0/icons/arrow-right.svg) center / contain no-repeat; mask: url(https://unpkg.com/lucide-static@0.460.0/icons/arrow-right.svg) center / contain no-repeat;"></span></span>
        </div>
      </a>
      <div style="display: grid; grid-template-columns: {{gridCols}}; column-gap: clamp(14px, 1.8vw, 24px); row-gap: clamp(22px, 2.6vw, 32px);">
        <sc-for list="{{projects}}" as="p" hint-placeholder-count="9">
          <a href="{{p.href}}" data-zoom="" data-cursor="View" style="grid-column: span {{p.span}}; display: flex; flex-direction: column; gap: 12px; color: #fff; text-decoration: none;">
            <div data-clip="" data-delay="{{p.delay}}" style="position: relative; overflow: hidden; aspect-ratio: {{p.ratio}}; background: var(--c-surface);">
              <img src="{{p.image}}" alt="{{p.title}}" loading="lazy" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: {{p.pos}};">
            </div>
            <div data-reveal="" data-delay="{{p.capDelay}}" style="position: relative; display: flex; align-items: center; gap: 18px; padding-bottom: 8px;">
              <span style="position: relative; padding-bottom: 3px; font-family: var(--f-display); font-size: 19px; font-weight: 500; line-height: 1; color: var(--c-accent);">{{p.num}}<span aria-hidden="true" style="position: absolute; left: 0; right: 0; bottom: 0; height: 2px; background: var(--c-accent);"></span></span>
              <span style="flex: 1; font-family: var(--f-display); font-size: 16px; line-height: 1.3;">{{p.title}}</span>
              <span data-arrow="" aria-hidden="true" style="width: 20px; height: 20px; flex: none; background: #fff; -webkit-mask: url(https://unpkg.com/lucide-static@0.460.0/icons/arrow-right.svg) center / contain no-repeat; mask: url(https://unpkg.com/lucide-static@0.460.0/icons/arrow-right.svg) center / contain no-repeat;"></span>
              <span data-uline="" aria-hidden="true" style="position: absolute; left: 0; right: 0; bottom: 0; height: 1px; background: rgba(255, 255, 255, 0.6); transform: scaleX(0); transform-origin: 0 50%;"></span>
            </div>
          </a>
        </sc-for>
      </div>
    </div>
  </section>
</main>
<dc-import name="SiteFooter" variant="form" hint-size="100%,520px"></dc-import>
</x-dc>
<div aria-hidden="true" style="position: fixed; right: 6px; bottom: 4px; z-index: 1000; pointer-events: none; padding: 3px 8px; background: rgba(12, 42, 77, 0.82); color: #fff; font: 500 11px/1.4 'Helvetica Neue', Arial, sans-serif; letter-spacing: 0.02em; border-radius: 3px;">Design preview – not the live site</div>
<script src="../switcher.js" defer></script>
<script type="text/x-dc" data-dc-script data-props="{&quot;intro&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Motion&quot;},&quot;motion&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Motion&quot;}}">
const PROJECTS = [
  { title: '458 E 1st Street', image: 'assets/458-e-1st.png', pos: '50% 60%' },
  { title: '7000 Williams Road', image: 'assets/p-03.png' },
  { title: '1235 Marine Drive', image: 'assets/p-04.png' },
  { title: '3560 Bluebonnet', image: 'assets/p-05.png', href: 'Project-3560-Bluebonnet.dc.html' },
  { title: '976 Melbourne', image: 'assets/p-06.png' },
  { title: '218 E 22nd Street', image: 'assets/p-07.png' },
  { title: '226 West 5th Street', image: 'assets/p-08.png' },
  { title: '754 East 17th Street', image: 'assets/p-09.png' },
  { title: '245 West 27th Street', image: 'assets/p-10.png' },
];
// rows: 2,2,3,2 → spans on a 6-col grid
const LAYOUT = [3, 3, 3, 3, 2, 2, 2, 3, 3];
const ROWSTART = [0, 0, 2, 2, 4, 4, 4, 7, 7];
const U = '../shared/natlandhomes/';
const SLIDES = [
  // pos = desktop crop, mpos = phone crop; tuned so each building stays as complete as possible
  { title: 'Seniors Residential & Commercial Development', hero: 'assets/seniors.png', pos: '50% 30%', mpos: '47% 50%' },
  { title: '458 E 1st Street', hero: 'assets/458-e-1st.png', pos: '50% 30%', mpos: '50% 50%' },
  { title: '7000 Williams Road', hero: U + 'Williams_POV01_VERFinal-1536x1229.jpg', fallback: 'assets/p-03.png', thumb: 'assets/p-03.png', pos: '50% 40%', mpos: '12% 50%' },
  { title: '1235 Marine Drive', hero: U + '1235-Marine-Drive-Enscape_2020-10-20-13-01-49-1536x814.jpg', fallback: 'assets/p-04.png', thumb: 'assets/p-04.png', pos: '20% 50%', mpos: '21% 50%' },
  { title: '3560 Bluebonnet', hero: 'assets/fb-3560-hero.png', thumb: 'assets/p-05.png', href: 'Project-3560-Bluebonnet.dc.html', pos: '60% 50%', mpos: '56% 50%' },
  { title: '976 Melbourne', hero: U + '976-Melbourne-001-1536x1024.jpg', fallback: 'assets/p-06.png', thumb: 'assets/p-06.png', pos: '50% 60%', mpos: '42% 50%' },
  { title: '218 E 22nd Street', hero: U + '218-E-22nd-Street-exterior-1200.jpg', fallback: 'assets/p-07.png', thumb: 'assets/p-07.png', pos: '50% 20%', mpos: '45% 50%' },
  { title: '226 West 5th Street', hero: U + '226-W-5th-exterior-1200.jpg', fallback: 'assets/p-08.png', thumb: 'assets/p-08.png', pos: '50% 30%', mpos: '60% 50%' },
  { title: '754 East 17th Street', hero: U + '754-East-17th-exterior-1200.jpg', fallback: 'assets/p-09.png', thumb: 'assets/p-09.png', pos: '50% 50%', mpos: '12% 50%' },
  { title: '245 West 27th Street', hero: U + '245-West-27th-exterior-1200.jpg', fallback: 'assets/p-10.png', thumb: 'assets/p-10.png', pos: '50% 40%', mpos: '10% 50%' },
].map(s => ({ ...s, fallback: s.fallback || s.hero, thumb: s.thumb || s.hero, pos: s.pos || '50% 50%', href: s.href || '#' }));
const AUTOPLAY_MS = 6000;
const pad = n => String(n).padStart(2, '0');

class Component extends DCLogic {
  mq = window.matchMedia('(max-width: 767px)');
  state = { m: this.mq.matches, i: 0, prev: null };
  titleRef = React.createRef();
  onMq = () => this.setState({ m: this.mq.matches });
  componentDidMount() { this.mq.addEventListener('change', this.onMq); this.restart(); }
  componentWillUnmount() { this.mq.removeEventListener('change', this.onMq); clearInterval(this.timer); }
  lastI = 0;
  componentDidUpdate() {
    const changed = this.lastI !== this.state.i; this.lastI = this.state.i;
    if (changed && this.titleRef.current && !matchMedia('(prefers-reduced-motion: reduce)').matches) {
      this.titleRef.current.animate([{ transform: 'translateY(105%)' }, { transform: 'none' }], { duration: 900, easing: 'cubic-bezier(0.16,1,0.3,1)' });
    }
  }
  // Auto-advance; any manual change restarts the countdown so it never jumps right after a click.
  restart() {
    clearInterval(this.timer);
    if (matchMedia('(prefers-reduced-motion: reduce)').matches || this.props.motion === false) return;
    this.timer = setInterval(() => { if (!document.hidden) this.go(this.state.i + 1, true); }, AUTOPLAY_MS);
  }
  go = (i, auto) => {
    const n = SLIDES.length; i = (i + n) % n;
    if (i !== this.state.i) this.setState(s => ({ i, prev: s.i }));
    if (!auto) this.restart();
  };
  renderVals() {
    const { m, i, prev } = this.state, n = SLIDES.length;
    const cur = SLIDES[i];
    const E = 'cubic-bezier(0.77,0,0.18,1)';
    const win = [i - 2, i - 1, i].map(k => (k + n) % n);
    return {
      ready: true,
      intro: this.props.intro ?? true,
      motion: this.props.motion ?? true,
      titleRef: this.titleRef,
      heroH: m ? '78vh' : '100vh',
      heroMin: m ? '520px' : '680px',
      heroPadB: m ? '28px' : 'clamp(36px, 4vw, 56px)',
      h1Size: m ? '36px' : 'clamp(48px, 5vw, 76px)',
      slides: SLIDES.map((s, k) => ({
        ...s,
        pos: m ? s.mpos : s.pos,
        z: k === i ? 2 : k === prev ? 1 : 0,
        clip: k === i || k === prev ? 'inset(0 0 0 0)' : 'inset(0 0 0 100%)',
        trans: k === i ? 'clip-path 1.2s ' + E : 'none',
        scale: k === i ? 1 : 1.12,
        imgTrans: k === i ? 'transform 1.8s cubic-bezier(0.16,1,0.3,1)' : 'none',
      })),
      curTitle: cur.title, curNum: pad(i + 1), total: pad(n), curHref: cur.href,
      prev: () => this.go(i - 1), next: () => this.go(i + 1),
      strip: win.map((k, j) => ({
        title: SLIDES[k].title, image: SLIDES[k].thumb, pos: SLIDES[k].pos, delay: j * 100,
        outline: k === i ? '2px solid #c8102e' : '2px solid rgba(200,16,46,0)',
        op: k === i ? 1 : 0.72,
        color: k === i ? '#fff' : 'var(--c-ink-soft)',
        select: () => this.go(k),
      })),
      featCols: m ? 'minmax(0, 1fr)' : 'minmax(0, 2.6fr) minmax(0, 1fr)',
      featGap: m ? '16px' : 'clamp(24px, 3vw, 48px)',
      featTitle: m ? '20px' : 'clamp(20px, 1.8vw, 26px)',
      feature: { href: '#' },
      gridCols: m ? 'minmax(0, 1fr)' : 'repeat(6, minmax(0, 1fr))',
      projects: PROJECTS.map((p, i) => {
        const span = m ? 1 : LAYOUT[i];
        const col = m ? 0 : i - ROWSTART[i];
        return {
          ...p, href: p.href || '#', pos: p.pos || '50% 50%',
          num: String(i + 2).padStart(2, '0'),
          span, ratio: span === 2 ? '16 / 9' : '16 / 7.4',
          delay: col * 140, capDelay: col * 140 + 380,
        };
      }),
    };
  }
}
</script>
</body>
</html>
