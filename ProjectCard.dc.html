<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><link rel="stylesheet" href="theme.css"></helmet>
<sc-if value="{{isCard}}" hint-placeholder-val="{{true}}">
  <a href="{{href}}" onMouseEnter="{{enter}}" onMouseLeave="{{leave}}" style="display: flex; flex-direction: column; gap: var(--sp-3); color: var(--c-ink); text-decoration: none;">
    <div style="position: relative; overflow: hidden; aspect-ratio: 16 / 10; background: var(--c-surface);">
      <img src="{{image}}" alt="{{title}}" loading="lazy" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: {{pos}}; transition: transform 0.9s var(--ease); transform: scale({{scale}});">
    </div>
    <div style="display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: var(--sp-4); align-items: start;">
      <span style="font-family: var(--f-display); font-size: 18px; font-weight: var(--fw-semibold); line-height: 1.3; color: var(--c-accent);">{{num}}</span>
      <span style="font-family: var(--f-display); font-size: var(--fs-card); font-weight: var(--fw-medium); line-height: 1.3; padding-top: 1px; text-wrap: pretty;">{{title}}</span>
      <span aria-hidden="true" style="width: 32px; height: 32px; border-radius: 50%; border: 1px solid {{ring}}; background: {{ringBg}}; display: flex; align-items: center; justify-content: center; transition: background 0.25s, border-color 0.25s;">
        <span style="width: 14px; height: 14px; background: {{arrow}}; -webkit-mask: url(https://unpkg.com/lucide-static@0.460.0/icons/chevron-right.svg) center / contain no-repeat; mask: url(https://unpkg.com/lucide-static@0.460.0/icons/chevron-right.svg) center / contain no-repeat;"></span>
      </span>
    </div>
  </a>
</sc-if>
<sc-if value="{{isRow}}" hint-placeholder-val="{{false}}">
  <a href="{{href}}" style="display: grid; grid-template-columns: 104px minmax(0, 1fr) auto; gap: var(--sp-4); align-items: center; padding: var(--sp-3) 0; border-bottom: 1px solid var(--c-line); color: var(--c-ink); text-decoration: none;">
    <img src="{{image}}" alt="{{title}}" loading="lazy" style="width: 104px; height: 72px; object-fit: cover; object-position: {{pos}};">
    <span style="display: flex; flex-direction: column; gap: 2px;">
      <span style="font-family: var(--f-display); font-size: 15px; font-weight: var(--fw-semibold); color: var(--c-accent);">{{num}}</span>
      <span style="font-family: var(--f-display); font-size: 15px; font-weight: var(--fw-medium); line-height: 1.3; text-wrap: pretty;">{{title}}</span>
    </span>
    <span aria-hidden="true" style="width: 32px; height: 32px; border-radius: 50%; border: 1px solid var(--c-line); display: flex; align-items: center; justify-content: center;">
      <span style="width: 14px; height: 14px; background: var(--c-ink); -webkit-mask: url(https://unpkg.com/lucide-static@0.460.0/icons/chevron-right.svg) center / contain no-repeat; mask: url(https://unpkg.com/lucide-static@0.460.0/icons/chevron-right.svg) center / contain no-repeat;"></span>
    </span>
  </a>
</sc-if>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:380,&quot;height&quot;:320},&quot;variant&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;card&quot;,&quot;row&quot;],&quot;default&quot;:&quot;card&quot;,&quot;tsType&quot;:&quot;'card'|'row'&quot;},&quot;num&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;01&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;title&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;3560 Bluebonnet&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;href&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;#&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;image&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;assets/natlandhomes/3560-Bluebonnet-002-600x390.jpg&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;pos&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;50% 50%&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  state = { h: false };
  renderVals() {
    const v = this.props.variant ?? 'card';
    const h = this.state.h;
    return {
      isCard: v === 'card', isRow: v === 'row',
      num: this.props.num ?? '01',
      title: this.props.title ?? '3560 Bluebonnet',
      href: this.props.href ?? '#',
      image: this.props.image ?? 'assets/natlandhomes/3560-Bluebonnet-002-600x390.jpg',
      pos: this.props.pos ?? '50% 50%',
      scale: h ? 1.05 : 1,
      ring: h ? 'var(--c-accent)' : 'var(--c-line)',
      ringBg: h ? 'var(--c-accent)' : 'transparent',
      arrow: h ? '#fff' : 'var(--c-ink)',
      enter: () => this.setState({ h: true }),
      leave: () => this.setState({ h: false }),
    };
  }
}
</script>
</body>
</html>
