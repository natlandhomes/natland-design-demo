<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><link rel="stylesheet" href="theme.css"></helmet>
<sc-if value="{{plain}}" hint-placeholder-val="{{true}}">
  <section style="background: var(--c-dark); color: var(--c-on-dark);">
    <div style="max-width: var(--max-w); margin: 0 auto; padding: clamp(72px, 10vw, 150px) var(--gutter) clamp(56px, 7vw, 104px); display: flex; flex-direction: column; align-items: center; text-align: center; gap: var(--sp-5);">
      <span aria-hidden="true" style="display: block; width: 40px; height: 1px; background: var(--c-on-dark-soft);"></span>
      <h1 style="margin: 0; font-family: var(--f-display); font-weight: var(--fw-regular); font-size: var(--fs-h1); line-height: var(--lh-tight); letter-spacing: -0.01em; text-wrap: balance;">{{title}}</h1>
    </div>
  </section>
</sc-if>
<sc-if value="{{withImage}}" hint-placeholder-val="{{false}}">
  <section style="position: relative; overflow: hidden; background: var(--c-dark); color: var(--c-on-dark); min-height: clamp(340px, 46vw, 680px); display: flex; align-items: flex-end;">
    <img src="{{image}}" alt="" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover;">
    <div aria-hidden="true" style="position: absolute; inset: 0; background: linear-gradient(to top, var(--c-scrim-strong) 0%, var(--c-scrim) 45%, rgba(0, 20, 34, 0.18) 100%);"></div>
    <div style="position: relative; width: 100%; max-width: var(--max-w); margin: 0 auto; padding: var(--sp-9) var(--gutter) clamp(40px, 6vw, 88px); display: flex; flex-direction: column; align-items: flex-start; gap: var(--sp-5);">
      <span aria-hidden="true" style="display: block; width: 40px; height: 1px; background: var(--c-on-dark);"></span>
      <h1 style="margin: 0; font-family: var(--f-display); font-weight: var(--fw-regular); font-size: var(--fs-h1); line-height: var(--lh-tight); letter-spacing: -0.01em; text-wrap: balance;">{{title}}</h1>
    </div>
  </section>
</sc-if>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:&quot;100%&quot;,&quot;height&quot;:480},&quot;title&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Portfolio&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;image&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const img = this.props.image;
    return { title: this.props.title ?? 'Portfolio', image: img, plain: !img, withImage: !!img };
  }
}
</script>
</body>
</html>
